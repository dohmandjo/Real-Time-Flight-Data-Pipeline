[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import sorting, and bugbear's likely-bug checks.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["load_warehouse", "run_producer", "sheets_sink", "transforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:read_text is deprecated:DeprecationWarning",   # kafka-python internals
    "ignore:open_text is deprecated:DeprecationWarning",
]
