# Requires Docker Compose v2 (`docker compose`).
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build                       # Airflow-orchestrated (default)
#   docker compose --profile standalone up -d \        # same pipeline WITHOUT Airflow:
#       postgres kafka producer spark loader sheets-sink   #   plain loop containers instead of DAGs
#
# Run either mode, never both: the loader/sink loops and the Airflow DAGs do the same work.
name: flight-pipeline

# Shared settings for the three Airflow containers.
x-airflow-common: &airflow-common
  build: ./airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # The DAGs import the same loader / sheets-sink code the standalone containers run.
    PYTHONPATH: /opt/airflow/apps/loader:/opt/airflow/apps/sheets_sink
    GOOGLE_APPLICATION_CREDENTIALS: /secrets/gsa-keys.json
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./apps/loader:/opt/airflow/apps/loader:ro
    - ./apps/sheets_sink:/opt/airflow/apps/sheets_sink:ro
    - ${GSA_KEY_PATH:-~/gsa/gsa-keys.json}:/secrets/gsa-keys.json:ro

services:
  # ------------------------------------------------------------------ warehouse
  postgres:
    image: postgres:16
    container_name: flight_postgres
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}   # used only by db/02_create_airflow_db.sh
    ports: ["5432:5432"]                            # exposed for psql / DBeaver during development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in docker-entrypoint-initdb.d run once, in name order, when the volume is first created.
      - ./db/00_warehouse.sql:/docker-entrypoint-initdb.d/00_warehouse.sql:ro
      - ./db/01_views.sql:/docker-entrypoint-initdb.d/01_views.sql:ro
      - ./db/02_create_airflow_db.sh:/docker-entrypoint-initdb.d/02_create_airflow_db.sh:ro

  # ------------------------------------------------------------------ streaming
  kafka:
    image: bitnami/kafka:3.7
    container_name: flight_kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9094,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9094      # how other containers reach the broker
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1               # single broker
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true                   # dev convenience
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "${HOST_KAFKA_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9094 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  producer:                       # Aviationstack API -> Kafka
    build: ./apps/producer
    env_file: .env
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  spark:                          # Kafka -> Structured Streaming -> Postgres staging
    build: ./apps/spark_app
    container_name: flight_spark
    env_file: .env
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/opt/bitnami/spark/app/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,org.postgresql:postgresql:42.7.3
      - /opt/bitnami/spark/app/flight_stream.py
    volumes:
      - spark_ivy:/opt/bitnami/spark/app/ivy
    restart: unless-stopped

  # ------------------------------------------------------------------ orchestration (default)
  airflow-init:                   # one-shot: migrate the metadata DB and create the admin user
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --role Admin --firstname Admin --lastname User --email admin@example.com
        --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        || echo "Admin user already exists")
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # ------------------------------------------------------------------ standalone mode (no Airflow)
  loader:                         # staging -> star schema, every 60 s
    profiles: ["standalone"]
    build: ./apps/loader
    container_name: flight_loader
    env_file: .env
    command: ["python", "load_warehouse.py", "--interval-seconds", "60"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  sheets-sink:                    # curated view -> Google Sheets
    profiles: ["standalone"]
    build: ./apps/sheets_sink
    container_name: flight_gsheet
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gsa-keys.json
    volumes:
      - ${GSA_KEY_PATH:-~/gsa/gsa-keys.json}:/secrets/gsa-keys.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  spark_ivy:
